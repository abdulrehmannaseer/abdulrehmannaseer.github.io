name: Get Citation Data

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'google_scholar_crawler/**'
      - '.github/workflows/google_scholar_crawler.yaml'

permissions:
  contents: write

concurrency:
  group: google-scholar-citations
  cancel-in-progress: false

jobs:
  citations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install Scholar client
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Restore last successful data
        shell: bash
        run: |
          mkdir -p google_scholar_crawler/results
          status=0
          git ls-remote --exit-code --heads origin google-scholar-stats > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch origin google-scholar-stats
            git show FETCH_HEAD:gs_data.json > google_scholar_crawler/results/gs_data.json
          elif [ "$status" -ne 2 ]; then
            exit "$status"
          fi
      - name: Fetch current citations
        run: timeout 240 python google_scholar_crawler/main.py
        continue-on-error: true
        env:
          GOOGLE_SCHOLAR_ID: ZTuS-yUAAAAJ
      - name: Publish saved citation data
        shell: bash
        run: |
          if [ ! -f google_scholar_crawler/results/gs_data.json ]; then
            echo 'No successful retrieval yet. The website will show only the Scholar link.'
            exit 0
          fi
          cp google_scholar_crawler/results/gs_data.json "$RUNNER_TEMP/gs_data.json"
          if git show-ref --verify --quiet refs/remotes/origin/google-scholar-stats; then
            git checkout -B google-scholar-stats origin/google-scholar-stats
          else
            git checkout --orphan google-scholar-stats
            git rm -rf .
          fi
          cp "$RUNNER_TEMP/gs_data.json" gs_data.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Google Scholar citation count'
            git push origin HEAD:google-scholar-stats
          fi
