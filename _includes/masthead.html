<header class="masthead">
  <div class="masthead__inner-wrap">
    <a class="site-brand" href="/">{{ site.title }}</a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="primary-nav"><i class="fas fa-bars" aria-hidden="true"></i></button>
    <nav id="primary-nav" class="primary-nav" aria-label="Primary">
      <ul>
        {% for link in site.data.navigation.main %}
          <li><a href="{{ link.url }}">{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
      <i class="fas fa-moon" aria-hidden="true"></i>
      <i class="fas fa-sun" aria-hidden="true"></i>
    </button>
  </div>
</header>
